<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spanish Word DB</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="panel loading-panel">
      <h1>Spanish Word DB</h1>
      <p>Loading…</p>
    </section>
  </main>
  <template id="nullable-cell-template">
    <div class="nullable-cell">
      <input type="text" autocomplete="off" spellcheck="false">
      <label class="none-toggle"><input type="checkbox"> None</label>
    </div>
  </template>
  <template id="irregular-cell-template">
    <div class="nullable-cell irregular-cell">
      <input type="text" autocomplete="off" spellcheck="false">
      <label class="none-toggle"><input type="checkbox" data-role="none"> None</label>
      <label class="irregular-toggle"><input type="checkbox" data-role="irregular"> Irregular</label>
    </div>
  </template>
  <script src="/static/app.js" defer></script>
</body>
</html>
